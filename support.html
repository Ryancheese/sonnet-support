  <h1>Sonnet 技术支持</h1>
  <p>Sonnet 在 iPhone 和 iPad 上播放你自己的音乐。连接 Apple Music 之后，也可以搜索和播放 Apple Music 里的歌。</p>
  <h2>联系</h2>
  <p>邮箱 <a href="mailto:525328634@qq.com">525328634@qq.com</a><br>QQ 525328634</p>
  <h2>添加本地歌曲</h2>
  <p>在资料库的本地页点「＋」，选中音频文件。歌曲会复制进 Sonnet，原来的文件还在原处。歌名、艺人和时长都接近的歌不会再收一次。</p>
  <h2>歌词不对</h2>
  <p>在正在播放的页面更换歌词来源。来源包括 LRCLIB、网易云音乐和 QQ 音乐。</p>
  <h2>画面卡顿</h2>
  <p>到设置里把舞台帧率调低。</p>
